suite: service and serviceaccount
templates:
  - service.yaml
  - serviceaccount.yaml
set:
  rtsp.host: cam.lan
  sftp.host: sftp.lan
  sftp.username: uploader
  sftp.password: zzSFTPSECRETzz
  sftp.insecureIgnoreHostKey: true
tests:
  - it: exposes the health port
    template: service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: rtsp-sftp-uploader

  - it: honours the service type and annotations
    template: service.yaml
    set:
      service.type: LoadBalancer
      service.annotations:
        example.com/purpose: probes
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: metadata.annotations["example.com/purpose"]
          value: probes

  - it: is not rendered when the service is disabled
    template: service.yaml
    set:
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when http is disabled
    template: service.yaml
    set:
      http.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a ServiceAccount that does not mount its token
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rtsp-sftp-uploader
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: passes ServiceAccount annotations through
    template: serviceaccount.yaml
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::1:role/x
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::1:role/x

  - it: is not created when disabled
    template: serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
