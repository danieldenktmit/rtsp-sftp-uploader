suite: secret
templates:
  - secret.yaml
set:
  rtsp.host: cam.lan
  sftp.host: sftp.lan
  sftp.username: uploader
  sftp.password: zzSFTPSECRETzz
  sftp.insecureIgnoreHostKey: true
tests:
  - it: holds the SFTP password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.SFTP_PASSWORD
          value: zzSFTPSECRETzz

  - it: holds the camera password
    set:
      rtsp.password: zzCAMSECRETzz
    asserts:
      - equal:
          path: stringData.RTSP_PASSWORD
          value: zzCAMSECRETzz

  - it: holds URL forms, which may embed credentials
    set:
      rtsp.url: rtsp://admin:pw@cam.lan:554/live
      sftp.url: sftp://bob:pw@files.example.com/photos
    asserts:
      - equal:
          path: stringData.RTSP_URL
          value: rtsp://admin:pw@cam.lan:554/live
      - equal:
          path: stringData.SFTP_URL
          value: sftp://bob:pw@files.example.com/photos

  - it: holds the private key and its passphrase
    set:
      sftp.privateKey: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        fake
        -----END OPENSSH PRIVATE KEY-----
      sftp.privateKeyPassphrase: zzPASSPHRASEzz
    asserts:
      - matchRegex:
          path: stringData.id
          pattern: BEGIN OPENSSH PRIVATE KEY
      - equal:
          path: stringData.SFTP_PRIVATE_KEY_PASSPHRASE
          value: zzPASSPHRASEzz

  - it: holds known_hosts
    set:
      sftp.insecureIgnoreHostKey: false
      sftp.knownHosts: "[sftp.lan]:22 ssh-ed25519 AAAAC3Nz"
    asserts:
      - matchRegex:
          path: stringData.known_hosts
          pattern: ssh-ed25519

  - it: omits keys that are not configured
    asserts:
      - isNull:
          path: stringData.RTSP_PASSWORD
      - isNull:
          path: stringData.id
      - isNull:
          path: stringData.known_hosts

  - it: is not rendered when an existing Secret is supplied
    set:
      existingSecret: my-camera-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when nothing secret is configured
    set:
      sftp.password: ""
      sftp.privateKey: ""
      existingSecret: ""
      sftp.url: ""
    asserts:
      - hasDocuments:
          count: 0
