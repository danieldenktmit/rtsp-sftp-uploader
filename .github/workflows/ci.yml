name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  HELM_VERSION: v3.19.0
  HELM_UNITTEST_VERSION: v1.1.2
  KUBECONFORM_VERSION: v0.8.0
  # Schema version the rendered manifests are validated against; keep it at or
  # above the chart's kubeVersion floor.
  KUBERNETES_VERSION: 1.29.0
  CHART: charts/rtsp-sftp-uploader

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m
      - name: Every referenced action tag exists
        # GitHub only reports an unresolvable `uses:` ref when the workflow runs,
        # so without this a bad pin surfaces as a failed release.
        run: ./scripts/check-action-refs.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Unit tests with the race detector and a coverage gate
        run: ./scripts/coverage.sh
        env:
          THRESHOLD: "85"
      - name: Re-run the timing-sensitive packages to catch flakes
        run: go test -race -count=3 ./internal/app/ ./internal/health/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} go build -trimpath ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          helm lint "$CHART" \
            --set rtsp.host=cam.lan --set sftp.host=sftp.lan \
            --set sftp.username=up --set sftp.password=zzSECRETzz \
            --set sftp.insecureIgnoreHostKey=true
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION"
      - name: helm unittest
        run: helm unittest "$CHART"
      - name: Render the manifests
        run: |
          helm template t "$CHART" \
            --set rtsp.host=cam.lan --set rtsp.username=admin --set rtsp.password=zzCAMSECRETzz \
            --set sftp.host=sftp.lan --set sftp.username=up --set sftp.password=zzSFTPSECRETzz \
            --set sftp.insecureIgnoreHostKey=true > rendered.yaml
          test -s rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Validate the manifests against the Kubernetes schema
        # kubeconform rather than `kubectl apply --dry-run=client`: the latter
        # downloads the OpenAPI schema from a live API server, which CI has none of.
        run: kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" rendered.yaml
      - name: No credential may appear in the ConfigMap
        run: |
          if awk '/^kind: ConfigMap/,/^---$/' rendered.yaml | grep -qE 'zzCAMSECRETzz|zzSFTPSECRETzz'; then
            echo "FAIL: a secret value was rendered into the ConfigMap"; exit 1
          fi
          echo "OK: no secret values in the ConfigMap"
      - name: Every fail-fast validation produces its message
        run: |
          set -u
          expect_fail() {
            local want="$1"; shift
            if out=$(helm template t "$CHART" "$@" 2>&1); then
              echo "FAIL: expected the template to be rejected: $*"; exit 1
            fi
            if ! printf '%s' "$out" | grep -qF "$want"; then
              echo "FAIL: expected message '$want', got: $out"; exit 1
            fi
            echo "OK: $want"
          }
          expect_fail "set either rtsp.url or rtsp.host" \
            --set sftp.host=s --set sftp.username=u --set sftp.password=p --set sftp.insecureIgnoreHostKey=true
          expect_fail "set either sftp.url or sftp.host" \
            --set rtsp.host=c --set sftp.username=u --set sftp.password=p --set sftp.insecureIgnoreHostKey=true
          expect_fail "configure host key verification" \
            --set rtsp.host=c --set sftp.host=s --set sftp.username=u --set sftp.password=p
          expect_fail "mutually exclusive" \
            --set rtsp.host=c --set sftp.host=s --set sftp.username=u --set sftp.password=p \
            --set sftp.insecureIgnoreHostKey=true --set sftp.hostKeyFingerprint=SHA256:x
          expect_fail "replicaCount must be 1" \
            --set rtsp.host=c --set sftp.host=s --set sftp.username=u --set sftp.password=p \
            --set sftp.insecureIgnoreHostKey=true --set replicaCount=2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the amd64 image into the local daemon
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rtsp-sftp-uploader:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: IMAGE=rtsp-sftp-uploader:ci ./scripts/docker-smoke.sh

  docker-multiarch:
    # Cross-architecture builds are slow; run them on main and on demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
