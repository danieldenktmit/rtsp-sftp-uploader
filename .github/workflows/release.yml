name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases
  packages: write # push to GHCR
  id-token: write # keyless cosign signing
  attestations: write # build provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART: charts/rtsp-sftp-uploader
  HELM_VERSION: v3.19.0

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=rtsp-sftp-uploader
            org.opencontainers.image.description=Captures a frame from an RTSP camera and uploads it to an SFTP server on an interval

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to a full version: sigstore/cosign-installer publishes no floating
      # v4 tag (it has v2 and v3, but not v4), so `@v4` does not resolve.
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Derive the version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package the chart, stamping version and appVersion
        run: |
          helm package "$CHART" \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}" \
            --destination dist

      - name: Log in to GHCR for the OCI push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Push the chart as an OCI artifact
        run: |
          helm push "dist/rtsp-sftp-uploader-${{ steps.v.outputs.version }}.tgz" \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz

  release:
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: helm-chart
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tgz
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.image.outputs.version }}
            ```

            Platforms: `linux/amd64`, `linux/arm64`, `linux/arm/v7`.
            Signed with cosign (keyless) and published with a build provenance attestation.

            ## Helm chart

            ```
            helm install my-cam oci://ghcr.io/${{ github.repository_owner }}/charts/rtsp-sftp-uploader \
              --version ${{ needs.image.outputs.version }} \
              --set rtsp.host=cam.lan \
              --set rtsp.username=admin \
              --set rtsp.password=... \
              --set sftp.host=sftp.lan \
              --set sftp.username=uploader \
              --set sftp.password=... \
              --set sftp.hostKeyFingerprint=SHA256:...
            ```
